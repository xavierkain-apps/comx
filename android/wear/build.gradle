apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

/**
 * SoarX Voice — Wear OS companion (Galaxy Watch, Pixel Watch, ...).
 *
 * The Wearable Data Layer only pairs a watch app with a phone app that has the
 * SAME applicationId and the SAME signing key. So:
 *   - applicationId is com.xavier.comx, exactly like :app;
 *   - signing resolves exactly like :app (keystore.properties, then env vars,
 *     falling back to the shared debug keystore in app/).
 *
 * versionCode lives in its own range (100000+) so it never collides with the
 * phone app's codes under the same Play listing. Bump it for every wear upload.
 */
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def signingProp = { String key, String envName ->
    return keystoreProps.getProperty(key) ?: System.getenv(envName)
}

android {
    namespace "com.soarxvoice.wear"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "com.xavier.comx"
        minSdkVersion 30
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 100001
        versionName "0.1"
    }

    signingConfigs {
        debug {
            // The phone app's debug keystore: debug builds of both pair too.
            storeFile rootProject.file("app/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def storePath = signingProp("storeFile", "ANDROID_KEYSTORE_FILE")
            if (storePath != null) {
                storeFile rootProject.file(storePath)
                storePassword signingProp("storePassword", "ANDROID_KEYSTORE_PASSWORD")
                keyAlias signingProp("keyAlias", "ANDROID_KEY_ALIAS")
                keyPassword signingProp("keyPassword", "ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingProp("storeFile", "ANDROID_KEYSTORE_FILE") != null
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled false
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        // Protocol constants and codecs shared verbatim with the phone module.
        main.java.srcDirs += rootProject.file("watch-shared/src")
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2025.05.01")
    implementation composeBom

    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.activity:activity-compose:1.10.1"
    // androidx.wear pulls an old Fragment; ActivityResult APIs need >= 1.3 (lint fatal).
    implementation "androidx.fragment:fragment:1.8.6"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.0"
    implementation "androidx.lifecycle:lifecycle-service:2.9.0"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material:material-icons-core"

    implementation "androidx.wear.compose:compose-material:1.4.1"
    implementation "androidx.wear.compose:compose-foundation:1.4.1"
    implementation "androidx.wear.compose:compose-navigation:1.4.1"
    implementation "androidx.wear:wear:1.3.0"
    implementation "androidx.wear:wear-ongoing:1.0.0"

    implementation "com.google.android.gms:play-services-wearable:19.0.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0"

    testImplementation "junit:junit:4.13.2"
    // Real org.json on the JVM: android.jar only ships stubs.
    testImplementation "org.json:json:20240303"
}
