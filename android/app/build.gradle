apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Proguard/R8 minification.
 *
 * Deliberately OFF for the v2.0 beta: Agora and React Native both rely on
 * reflection, and a minification regression only shows up at runtime — which
 * cannot be verified from a CI build. Keep rules are already written in
 * proguard-rules.pro; flip this to true once the beta has been device-tested.
 */
def enableProguardInReleaseBuilds = false

/**
 * Release signing credentials.
 *
 * Never hardcode these. Resolution order:
 *   1. android/keystore.properties  (local dev, gitignored)
 *   2. environment variables        (CI)
 */
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def signingProp = { String key, String envName ->
    return keystoreProps.getProperty(key) ?: System.getenv(envName)
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.soarxvoice"
    defaultConfig {
        applicationId "com.xavier.comx"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def storePath = signingProp('storeFile', 'ANDROID_KEYSTORE_FILE')
            if (storePath != null) {
                // Resolved from android/, not android/app/, so the same value
                // works in keystore.properties and in CI.
                storeFile rootProject.file(storePath)
                storePassword signingProp('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingProp('keyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword signingProp('keyPassword', 'ANDROID_KEY_PASSWORD')
            }
        }
    }
    splits {
        abi {
            // Per-ABI APKs for direct beta installs: ~1/3 the size of a universal
            // APK. x86_64 is kept so the app runs on a desktop Android emulator.
            reset()
            enable true
            include "armeabi-v7a", "arm64-v8a", "x86_64"
            universalApk true
        }
    }

    packaging {
        jniLibs {
            // SoarX Voice is voice-only: it joins in Communication profile with a
            // speech audio profile and never publishes or subscribes to video.
            // Agora ships its full video stack by default, which is ~half the
            // binary. These extensions are loaded lazily by name and are never
            // reached, so excluding them is safe.
            //
            // Deliberately kept: the AI echo-cancellation and noise-suppression
            // extensions (valuable against wind noise in flight) and the audio
            // codecs used by playEffect.
            excludes += [
                "**/libagora_clear_vision_extension.so",
                "**/libagora_content_inspect_extension.so",
                "**/libagora_face_capture_extension.so",
                "**/libagora_face_detection_extension.so",
                "**/libagora_lip_sync_extension.so",
                "**/libagora_screen_capture_extension.so",
                "**/libagora_segmentation_extension.so",
                "**/libagora_spatial_audio_extension.so",
                "**/libagora_audio_beauty_extension.so",
                "**/libagora_video_av1_encoder_extension.so",
                "**/libagora_video_encoder_extension.so",
                "**/libagora_video_quality_analyzer_extension.so",
                // Not libvideo_dec.so / libvideo_enc.so: since Agora 4.6
                // libagora-rtc-sdk.so links libvideo_dec.so directly, and
                // without it the engine cannot load at all.
            ]
        }
    }
    sourceSets {
        // Wear OS Data Layer protocol, compiled verbatim into :wear as well.
        main.java.srcDirs += rootProject.file("watch-shared/src")
        // Barlow fonts: React Native loads assets/fonts/<family>.ttf.
        main.assets.srcDirs += rootProject.file("../assets")
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Fall back to debug signing so a checkout without credentials still builds
            signingConfig signingProp('storeFile', 'ANDROID_KEYSTORE_FILE') != null
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Watch companion (see docs/watch-android.md)
    implementation("com.google.android.gms:play-services-wearable:19.0.0")
    implementation("com.garmin.connectiq:ciq-companion-app-sdk:2.4.0@aar")

    testImplementation("junit:junit:4.13.2")
    // Real org.json and the Connect IQ serializer on the JVM (android.jar only ships stubs).
    testImplementation("org.json:json:20240303")
}
